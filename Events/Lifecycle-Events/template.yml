AWSTemplateFormatVersion: 2010-09-09
Transform: "AWS::Serverless-2016-10-31"
Description: AWS IoT Core Sample
Parameters:
  ProjectPrefix:
    Type: String
    Default: ""

Resources:
  #-------------------------------------------------------
  #   IoT Core
  #-------------------------------------------------------
  TopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub ${ProjectPrefix}TopicRule
      TopicRulePayload:
        Actions:
          - Sqs:
              QueueUrl: !Sub ${SQS.QueueUrl}
              RoleArn: !Sub ${IoTLifecycleEventsRuleRole.Arn}
              UseBase64: false
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: SELECT * FROM '$aws/events/presence/+/+' WHERE eventType = 'connected' OR eventType = 'disconnected'

  #-------------------------------------------------------
  # SQS
  #-------------------------------------------------------
  SQS:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 10
      QueueName: "IoT-Core-Lifecycle-event"

  #-------------------------------------------------------
  # CloudWatch LogGroup
  #-------------------------------------------------------
  SqsTriggeredLambdaForIoTLifeCycleEventLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SqsTriggeredLambdaForIoTLifeCycleEvent}

  #-------------------------------------------------------
  #   Lambda
  #-------------------------------------------------------
  SqsTriggeredLambdaForIoTLifeCycleEvent:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: Lambda
      FunctionName: SqsTriggeredLambdaForIoTLifeCycleEvent
      Handler: lambda_function.lambda_handler
      MemorySize: 512
      Role: !Sub ${LambdaRole.Arn}
      Runtime: python3.15
      Timeout: 5
      #X-Ray
      Tracing: Active
      Environment:
        Variables:
          LOG_LEVEL: DEBUG

  SqsTriggeredLambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Sub ${SQS.Arn}
      FunctionName: !GetAtt SqsTriggeredLambdaForIoTLifeCycleEvent.Arn

  # ------------------------------------------------------------#
  # IAM
  # ------------------------------------------------------------#
  IoTLifecycleEventsRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IoTRepublishPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SQS.Arn
      RoleName: !Sub ${ProjectPrefix}IoTLifecycleEventsRuleRole

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IoTPublishPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt SQS.Arn
      Path: /
      RoleName: !Sub ${ProjectPrefix}SqsTriggeredLambdaRoleForIoTLifeCycleEvent
