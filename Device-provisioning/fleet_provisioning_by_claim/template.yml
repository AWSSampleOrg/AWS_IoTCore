AWSTemplateFormatVersion: "2010-09-09"
Description: Fleet Provisioning - Complete Setup

Parameters:
  ProjectPrefix:
    Type: String
    Default: fleet

Resources:
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub ${ProjectPrefix}-device-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Join
              - ""
              - - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/
                - $${iot:Connection.Thing.ThingName}
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: "true"
          - Effect: Allow
            Action: iot:Publish
            Resource: !Join
              - ""
              - - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/*/
                - $${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Join
              - ""
              - - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/*/
                - $${iot:Connection.Thing.ThingName}/*
          - Effect: Allow
            Action: iot:Receive
            Resource: !Join
              - ""
              - - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/*/
                - $${iot:Connection.Thing.ThingName}/*

  ClaimPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub ${ProjectPrefix}-claim-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: "*"
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/certificates/create/*
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/provisioning-templates/fleet-provisioning-template/provision/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/certificates/create/*
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/provisioning-templates/fleet-provisioning-template/provision/*
          - Effect: Allow
            Action: iot:Receive
            Resource:
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/certificates/create/*
              - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/provisioning-templates/fleet-provisioning-template/provision/*

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSIoTThingsRegistration.html
        - arn:aws:iam::aws:policy/service-role/AWSIoTThingsRegistration

  HookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Hook:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectPrefix}-hook
      Runtime: python3.15
      Handler: index.lambda_handler
      Role: !GetAtt HookRole.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              print(event)
              sn = event.get('parameters', {}).get('SerialNumber', '')
              if sn:
                  return {'allowProvisioning': True, 'parameterOverrides': {'ThingName': f"Device-{sn}"}}
              return {'allowProvisioning': False}

  HookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Hook
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com

  ProvisioningTemplate:
    Type: AWS::IoT::ProvisioningTemplate
    Properties:
      Enabled: true
      ProvisioningRoleArn: !GetAtt Role.Arn
      PreProvisioningHook:
        TargetArn: !GetAtt Hook.Arn
      TemplateName: fleet-provisioning-template
      TemplateType: FLEET_PROVISIONING
      TemplateBody: !Sub |
        {
          "Parameters": {
            "SerialNumber": {"Type": "String"}
          },
          "Resources": {
            "thing": {
              "Type": "AWS::IoT::Thing",
              "Properties": {
                "ThingName": {"Ref": "SerialNumber"}
              }
            },
            "certificate": {
              "Type": "AWS::IoT::Certificate",
              "Properties": {
                "CertificateId": {"Ref": "AWS::IoT::Certificate::Id"},
                "Status": "ACTIVE"
              }
            },
            "policy": {
              "Type": "AWS::IoT::Policy",
              "Properties": {
                "PolicyName": "${DevicePolicy}"
              }
            }
          }
        }
